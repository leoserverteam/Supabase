
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - dbgate_net

  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:3000"
    volumes:
      - ./dbgate-data:/root/.dbgate
    networks:
      - dbgate_net
    depends_on:
      - postgres
    environment:
      # --- Предустановленные подключения к postgres из этого compose ---
      # (один сервер, несколько существующих баз на нём: main_database,
      # katelearn, travels - учти, что тут только эти 3, если появятся
      # новые базы на сервере - допиши по аналогии)
      - CONNECTIONS=postgres,katelearn,travels

      - LABEL_postgres=Postgres (main_database)
      - SERVER_postgres=postgres
      - PORT_postgres=5432
      - USER_postgres=${POSTGRES_USER}
      - PASSWORD_postgres=${POSTGRES_PASSWORD}
      - DATABASE_postgres=${POSTGRES_DB}
      - ENGINE_postgres=postgres@dbgate-plugin-postgres

      - LABEL_katelearn=Katelearn
      - SERVER_katelearn=postgres
      - PORT_katelearn=5432
      - USER_katelearn=${POSTGRES_USER}
      - PASSWORD_katelearn=${POSTGRES_PASSWORD}
      - DATABASE_katelearn=katelearn
      - ENGINE_katelearn=postgres@dbgate-plugin-postgres

      - LABEL_travels=Travels
      - SERVER_travels=postgres
      - PORT_travels=5432
      - USER_travels=${POSTGRES_USER}
      - PASSWORD_travels=${POSTGRES_PASSWORD}
      - DATABASE_travels=travels
      - ENGINE_travels=postgres@dbgate-plugin-postgres

      # --- SSO через Authentik (OAuth2/OIDC) ---
      - AUTH_PROVIDER=oauth
      - OAUTH_AUTH=https://leonet.site/application/o/authorize/
      - OAUTH_TOKEN=https://leonet.site/application/o/token/
      - OAUTH_LOGOUT=https://leonet.site/application/o/db-gate/end-session/
      - OAUTH_CLIENT_ID=${OPENID_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENID_CLIENT_SECRET}
      - OAUTH_SCOPE=openid email profile
      # preferred_username = user.username в Authentik, оно обязательное,
      # в отличие от email (там могут быть пустые почты у части юзеров)
      - OAUTH_LOGIN_FIELD=preferred_username

networks:
  dbgate_net:
    driver: bridge
